<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upgrader Mini App</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Цветовая палитра и базовые настройки */
        :root { 
            --bg: #0f0f13; 
            --panel: #1c1c24; 
            --accent: #007aff; 
            --win: #32d74b; 
            --lose: #ff453a; 
            --text: #ffffff; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; /* Запрещаем скролл страницы */
        }
        
        /* Шапка с профилем */
        .header { 
            background: var(--panel); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .user-info { font-size: 16px; font-weight: 500; }
        .balance-container { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .balance { font-size: 20px; font-weight: 700; color: #ffd60a; }
        .add-btn { background: rgba(255, 214, 10, 0.2); color: #ffd60a; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
        
        .container { padding: 20px; text-align: center; }
        
        /* Колесо апгрейдов */
        .wheel-box { 
            position: relative; 
            width: 240px; 
            height: 240px; 
            margin: 30px auto; 
            border-radius: 50%; 
            box-shadow: 0 0 40px rgba(0,0,0,0.5); 
        }
        .wheel { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            background: conic-gradient(var(--win) 0% 50%, var(--panel) 50% 100%); 
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.25, 1); 
            border: 4px solid #2c2c35; 
        }
        .pointer { 
            position: absolute; 
            top: -15px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent; 
            border-right: 15px solid transparent; 
            border-top: 25px solid #ffffff; 
            z-index: 10; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); 
        }
        .center-dot { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 40px; 
            height: 40px; 
            background: #2c2c35; 
            border-radius: 50%; 
            border: 3px solid #ffffff; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #888;
        }

        /* Панель управления */
        .controls { background: var(--panel); padding: 20px; border-radius: 20px; margin-top: 20px; }
        .controls-title { margin-bottom: 15px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        
        .chances { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .chance-btn { 
            flex: 1; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: var(--text); 
            padding: 12px 0; 
            margin: 0 5px; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 16px;
            cursor: pointer; 
            transition: 0.2s; 
        }
        .chance-btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        
        input { 
            width: 100%; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: #ffffff; 
            padding: 15px; 
            border-radius: 12px; 
            font-size: 16px; 
            text-align: center; 
            margin-bottom: 15px; 
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        
        .play-btn { 
            width: 100%; 
            background: linear-gradient(135deg, #007aff, #0056b3); 
            border: none; 
            color: white; 
            padding: 18px; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: 0.2s;
        }
        .play-btn:active { transform: scale(0.98); }
        .play-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Модальное окно пополнения */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 100; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(5px);
        }
        .modal-content { background: var(--panel); padding: 30px 25px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; }
        .modal h3 { margin-bottom: 10px; font-size: 20px; }
        .modal p { margin: 15px 0; font-size: 14px; color: #aaa; line-height: 1.5; }
        .modal-phone { display: inline-block; background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 10px; color: #fff; font-size: 20px; font-weight: bold; margin: 10px 0; letter-spacing: 1px; }
        
        .modal button { width: 100%; border: none; color: white; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-success { background: var(--win); }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #ccc !important; }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="header">
        <div class="user-info">👤 <span id="username">Загрузка...</span></div>
        <div class="balance-container" onclick="openDepositModal()">
            <span class="balance" id="balance">0</span> <span style="color: #ffd60a; font-weight: bold;">₽</span>
            <div class="add-btn">+</div>
        </div>
    </div>

    <div class="container">
        <!-- Блок с колесом -->
        <div class="wheel-box">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
            <div class="center-dot">UP</div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            <div class="controls-title">Шанс успеха</div>
            <div class="chances" id="chanceButtons">
                <button class="chance-btn" onclick="selectChance(10)">10%</button>
                <button class="chance-btn" onclick="selectChance(30)">30%</button>
                <button class="chance-btn active" onclick="selectChance(50)">50%</button>
                <button class="chance-btn" onclick="selectChance(75)">75%</button>
            </div>
            
            <input type="number" id="betAmount" placeholder="Сумма ставки (₽)" value="100">
            <button class="play-btn" id="playBtn" onclick="play()">Апгрейд</button>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <h3>Пополнение баланса</h3>
            <p>
                Переведите нужную сумму по номеру телефона (СБП):<br>
                <span class="modal-phone">+79069092500</span><br>
                Затем введите отправленную сумму ниже и подтвердите.
            </p>
            <input type="number" id="depositAmount" placeholder="Сумма перевода (₽)">
            <button class="btn-success" onclick="requestDeposit()">Я оплатил</button>
            <button class="btn-cancel" onclick="closeDepositModal()">Отмена</button>
        </div>
    </div>

    <!-- Логика приложения -->
    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Данные пользователя
        const userId = tg.initDataUnsafe?.user?.id || 123456789; // Тестовый ID для браузера
        const username = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || 'Гость';
        
        document.getElementById('username').innerText = username;
        
        let currentChance = 50;
        let isSpinning = false;
        let currentRotation = 0;

        // Загрузка баланса при входе
        async function loadProfile() {
            try {
                const res = await fetch('/api/user/' + userId);
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance;
            } catch (e) { 
                console.error("Не удалось загрузить профиль", e); 
            }
        }
        loadProfile();

        // Управление модальным окном
        function openDepositModal() {
            if (isSpinning) return;
            document.getElementById('depositModal').style.display = 'flex';
        }
        function closeDepositModal() {
            document.getElementById('depositModal').style.display = 'none';
            document.getElementById('depositAmount').value = '';
        }

        // Выбор шанса
        function selectChance(chance) {
            if (isSpinning) return;
            currentChance = chance;
            
            // Обновляем активную кнопку
            document.querySelectorAll('.chance-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Обновляем заливку колеса
            const wheel = document.getElementById('wheel');
            wheel.style.background = `conic-gradient(var(--win) 0% ${chance}%, var(--panel) ${chance}% 100%)`;
            
            // Вибрация при переключении
            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        // Логика вращения
        async function play() {
            if (isSpinning) return;
            
            const bet = Number(document.getElementById('betAmount').value);
            if (bet <= 0) {
                tg.showAlert('Пожалуйста, введите корректную ставку');
                return;
            }

            isSpinning = true;
            document.getElementById('playBtn').disabled = true;
            document.getElementById('playBtn').innerText = 'Вращение...';

            try {
                // Запрос к FastAPI серверу
                const res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, bet, chance: currentChance })
                });
                
                const data = await res.json();

                if (data.detail) { 
                    tg.showAlert(data.detail);
                    resetPlayButton();
                    return;
                }

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }

                const wheel = document.getElementById('wheel');
                const spins = 5; 
                
                let stopDegree;
                if (data.isWin) {
                    stopDegree = Math.random() * (currentChance * 3.6);
                } else {
                    stopDegree = (currentChance * 3.6) + Math.random() * ((100 - currentChance) * 3.6);
                }

                if (stopDegree < 2) stopDegree = 2;
                if (stopDegree > 358) stopDegree = 358;

                const totalRotation = currentRotation + (spins * 360) + (360 - stopDegree) - (currentRotation % 360);
                currentRotation = totalRotation;

                wheel.style.transform = `rotate(${totalRotation}deg)`;

                setTimeout(() => {
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred(data.isWin ? 'success' : 'error');
                    }
                    
                    document.getElementById('balance').innerText = data.newBalance;
                    
                    if (data.isWin) {
                        tg.showAlert(`🎉 Успех! Вы выиграли ${data.winAmount} ₽ (x${data.multiplier})`);
                    }
                    
                    resetPlayButton();
                }, 4000);

            } catch (e) {
                tg.showAlert('Ошибка соединения с сервером');
                resetPlayButton();
            }
        }

        function resetPlayButton() {
            isSpinning = false;
            document.getElementById('playBtn').disabled = false;
            document.getElementById('playBtn').innerText = 'Апгрейд';
        }

        // Пополнение
        async function requestDeposit() {
            const amount = Number(document.getElementById('depositAmount').value);
            if (amount < 50) {
                tg.showAlert('Минимальная сумма пополнения — 50 ₽');
                return;
            }

            closeDepositModal();
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            try {
                await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, amount, username })
                });
                tg.showAlert('✅ Запрос отправлен! Ожидайте подтверждения администратором.');
            } catch(e) {
                tg.showAlert('Ошибка отправки запроса');
            }
        }

        selectChance(50);
    </script>
</body>
</html>
