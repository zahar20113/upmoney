<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UPMoney</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050508;
            --card: #0a0a14;
            --card-hover: #0e0e1c;
            --border: #161628;
            --border-active: #242440;
            --gold: #e8b830;
            --gold-light: #f5d060;
            --gold-dark: #b8901a;
            --text: #f0f0f5;
            --text-secondary: #7a7a90;
            --green: #2dd4a8;
            --red: #f45050;
            --green-glow: rgba(45, 212, 168, 0.4);
            --red-glow: rgba(244, 80, 80, 0.4);
            --wheel-win: #0f2a1e;
            --wheel-win-alt: #122e22;
            --wheel-lose: #1a1010;
            --wheel-lose-alt: #1e1414;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            gap: 24px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 0; }

        /* ──────── Header ──────── */
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeDown 0.7s ease;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }
        .logo-up { color: var(--gold); }
        .logo-money { color: var(--text); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-pill {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .balance-pill:active { transform: scale(0.96); }
        .balance-dot {
            width: 6px; height: 6px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-glow);
        }
        .balance-currency {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .profile-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }
        .profile-btn:active { transform: scale(0.9); }
        .profile-btn svg {
            width: 18px; height: 18px;
            stroke: var(--text-secondary);
            transition: stroke 0.25s;
        }
        .profile-dot {
            position: absolute;
            top: -2px; right: -2px;
            width: 9px; height: 9px;
            background: var(--gold);
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        /* ──────── Wheel ──────── */
        .wheel-stage {
            position: relative;
            animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .wheel-aura {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .wheel-aura.win {
            opacity: 1;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            animation: auraPulse 0.8s ease-out;
        }
        .wheel-aura.lose {
            opacity: 1;
            background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
            animation: auraPulse 0.8s ease-out;
        }

        @keyframes auraPulse {
            0% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .wheel-frame {
            position: relative;
            width: 320px;
            height: 320px;
        }

        canvas#wheelCanvas {
            position: relative;
            z-index: 2;
            width: 320px;
            height: 320px;
            display: block;
        }

        /* Pointer -- clean triangle above the wheel */
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            transition: filter 0.3s;
        }
        .wheel-pointer svg {
            width: 24px;
            height: 16px;
            display: block;
        }
        .wheel-pointer.win svg { filter: drop-shadow(0 0 10px var(--green-glow)); }
        .wheel-pointer.lose svg { filter: drop-shadow(0 0 10px var(--red-glow)); }

        /* Center hub */
        .wheel-hub {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .hub-chance {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
            line-height: 1;
        }
        .hub-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        /* Outer ring */
        .wheel-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.06);
            pointer-events: none;
            z-index: 1;
        }

        /* ──────── Chance Selector ──────── */
        .chance-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 400px;
            animation: fadeUp 0.6s ease 0.25s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chance-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .chance-chip:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
        }
        .chance-chip:active { transform: scale(0.94); }
        .chance-chip.active {
            border-color: var(--gold);
            background: rgba(232, 184, 48, 0.06);
            box-shadow: 0 0 20px rgba(232, 184, 48, 0.08);
        }
        .chip-value {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            transition: color 0.3s;
        }
        .chance-chip.active .chip-value { color: var(--gold); }
        .chip-mult {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 2px;
            transition: color 0.3s;
        }
        .chance-chip.active .chip-mult { color: var(--gold-light); }
        .chip-tag {
            position: absolute;
            top: 6px; right: 6px;
            font-size: 7px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 8px;
            background: rgba(45, 212, 168, 0.1);
            color: var(--green);
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s;
        }
        .chance-chip.active .chip-tag { opacity: 1; transform: scale(1); }

        /* ──────── Bet Input ──────── */
        .bet-section {
            width: 100%;
            max-width: 400px;
            animation: fadeUp 0.6s ease 0.35s both;
        }
        .bet-row {
            display: flex;
            gap: 8px;
        }
        .bet-input-wrap {
            flex: 1;
            position: relative;
        }
        .bet-input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            outline: none;
            transition: all 0.3s;
        }
        .bet-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(232, 184, 48, 0.04);
        }
        .bet-input::placeholder { color: #1e1e2e; }
        .bet-currency {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            pointer-events: none;
        }
        .quick-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 46px;
        }
        .quick-btn:active {
            transform: scale(0.93);
            background: var(--card-hover);
            color: var(--text);
        }

        /* ──────── Play Button ──────── */
        .play-btn-wrap {
            width: 100%;
            max-width: 400px;
            animation: fadeUp 0.6s ease 0.45s both;
        }
        .play-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold), #d4a520);
            border: none;
            border-radius: 16px;
            color: #0a0a0a;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(232, 184, 48, 0.2);
        }
        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(232, 184, 48, 0.3);
        }
        .play-btn:active { transform: scale(0.97); }
        .play-btn:disabled {
            opacity: 0.45;
            pointer-events: none;
            filter: grayscale(20%);
        }
        .play-btn-shine {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transition: left 0.6s;
        }
        .play-btn:hover .play-btn-shine { left: 100%; }
        .play-btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .play-btn.loading .btn-text,
        .play-btn.loading .play-icon { display: none; }
        .play-spinner {
            display: none;
            width: 22px; height: 22px;
            border: 2.5px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.55s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .play-btn.loading .play-spinner { display: block; }

        /* ──────── Toast ──────── */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .toast {
            padding: 13px 22px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.3px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1), toastOut 0.3s ease 2s forwards;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-24px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-16px) scale(0.9); }
        }
        .toast.win {
            background: rgba(10,10,20,0.95);
            border: 1px solid rgba(45,212,168,0.35);
            color: var(--green);
        }
        .toast.lose {
            background: rgba(10,10,20,0.95);
            border: 1px solid rgba(244,80,80,0.35);
            color: var(--red);
        }
        .toast-icon { width: 18px; height: 18px; flex-shrink: 0; }

        @media (max-width: 380px) {
            .wheel-frame { width: 280px; height: 280px; }
            canvas#wheelCanvas { width: 280px; height: 280px; }
            .wheel-hub { width: 64px; height: 64px; }
            .hub-chance { font-size: 21px; }
            .bet-input { font-size: 18px; padding: 14px 44px 14px 16px; }
            .chance-chip { padding: 12px 4px; }
            .chip-value { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span class="logo-up">UP</span><span class="logo-money">MONEY</span>
        </div>
        <div class="header-right">
            <div class="balance-pill" id="balancePill">
                <div class="balance-dot"></div>
                <span id="balanceMini">0.00</span>
                <span class="balance-currency">RUB</span>
            </div>
            <div class="profile-btn" onclick="openProfile()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
                </svg>
                <div class="profile-dot"></div>
            </div>
        </div>
    </header>

    <!-- Wheel -->
    <section class="wheel-stage">
        <div class="wheel-frame" id="wheelFrame">
            <div class="wheel-aura" id="wheelAura"></div>
            <div class="wheel-ring"></div>
            <canvas id="wheelCanvas" width="640" height="640"></canvas>
            <div class="wheel-pointer" id="wheelPointer">
                <svg viewBox="0 0 24 16">
                    <polygon points="12,16 0,0 24,0" fill="#ffffff"/>
                </svg>
            </div>
            <div class="wheel-hub">
                <span class="hub-chance" id="hubChance">50%</span>
                <span class="hub-label">шанс</span>
            </div>
        </div>
    </section>

    <!-- Chance Selector -->
    <div class="chance-row" id="chanceRow">
        <div class="chance-chip" data-chance="10">
            <div class="chip-value">10%</div>
            <div class="chip-mult">×9.50</div>
            <div class="chip-tag">HOT</div>
        </div>
        <div class="chance-chip" data-chance="35">
            <div class="chip-value">35%</div>
            <div class="chip-mult">×2.80</div>
            <div class="chip-tag">MID</div>
        </div>
        <div class="chance-chip active" data-chance="50">
            <div class="chip-value">50%</div>
            <div class="chip-mult">×1.95</div>
            <div class="chip-tag">BEST</div>
        </div>
        <div class="chance-chip" data-chance="75">
            <div class="chip-value">75%</div>
            <div class="chip-mult">×1.30</div>
            <div class="chip-tag">SAFE</div>
        </div>
    </div>

    <!-- Bet -->
    <div class="bet-section">
        <div class="bet-row">
            <div class="bet-input-wrap">
                <input type="text" class="bet-input" id="betInput" placeholder="0" inputmode="decimal">
                <span class="bet-currency">₽</span>
            </div>
            <button class="quick-btn" onclick="quickBet(0.5)">½</button>
            <button class="quick-btn" onclick="quickBet(0.25)">¼</button>
            <button class="quick-btn" onclick="quickBet(1)">ALL</button>
        </div>
    </div>

    <!-- Play -->
    <div class="play-btn-wrap">
        <button class="play-btn" id="playBtn" onclick="play()">
            <div class="play-btn-shine"></div>
            <div class="play-btn-content">
                <span class="play-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5,3 19,12 5,21"/>
                    </svg>
                </span>
                <span class="btn-text">ИГРАТЬ</span>
            </div>
            <div class="play-spinner"></div>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#050508');
        tg.setBackgroundColor('#050508');

        let balance = 0;
        let selectedChance = 50;
        const multipliers = { 10: 9.50, 35: 2.80, 50: 1.95, 75: 1.30 };
        let isSpinning = false;

        // ──────── CANVAS WHEEL ────────
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const size = 640;
        const cx = size / 2;
        const cy = size / 2;
        const outerR = 290;
        const totalSegments = 360;
        let rotation = 0;

        // Segment colors -- deep, elegant, no harsh contrast
        const winBase = '#0d2218';
        const winAlt  = '#10291d';
        const loseBase = '#180e0e';
        const loseAlt  = '#1c1212';

        function drawWheel(highlightType = null, intensity = 0) {
            ctx.clearRect(0, 0, size, size);
            const slice = (2 * Math.PI) / totalSegments;

            // ── Segments ──
            for (let i = 0; i < totalSegments; i++) {
                const start = i * slice + rotation;
                const end = start + slice;
                const norm = ((start % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                const winZone = (selectedChance / 100) * 2 * Math.PI;
                const isWin = norm < winZone;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, outerR, start, end);
                ctx.closePath();

                if (highlightType === 'win' && isWin) {
                    ctx.fillStyle = `rgba(45,212,168,${0.25 * intensity})`;
                } else if (highlightType === 'lose' && !isWin) {
                    ctx.fillStyle = `rgba(244,80,80,${0.25 * intensity})`;
                } else if (isWin) {
                    ctx.fillStyle = i % 2 === 0 ? winBase : winAlt;
                } else {
                    ctx.fillStyle = i % 2 === 0 ? loseBase : loseAlt;
                }

                ctx.fill();
            }

            // ── Divider line (clean, thin, bright) ──
            const divAngle = rotation;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + outerR * Math.cos(divAngle),
                cy + outerR * Math.sin(divAngle)
            );
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.8;
            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.shadowBlur = 6;
            ctx.stroke();
            ctx.restore();

            // ── Tick marks on outer edge ──
            for (let i = 0; i < 72; i++) {
                const a = (i / 72) * 2 * Math.PI + rotation;
                const len = i % 6 === 0 ? 12 : 5;
                const r1 = outerR - len;
                ctx.beginPath();
                ctx.moveTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a));
                ctx.lineTo(cx + outerR * Math.cos(a), cy + outerR * Math.sin(a));
                ctx.strokeStyle = i % 6 === 0
                    ? 'rgba(255,255,255,0.12)'
                    : 'rgba(255,255,255,0.05)';
                ctx.lineWidth = i % 6 === 0 ? 1.2 : 0.6;
                ctx.stroke();
            }

            // ── Outer border ring ──
            ctx.beginPath();
            ctx.arc(cx, cy, outerR, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        drawWheel();

        // ──────── CHANCE ────────
        const chips = document.querySelectorAll('.chance-chip');
        const hubChance = document.getElementById('hubChance');

        document.getElementById('chanceRow').addEventListener('click', (e) => {
            if (isSpinning) return;
            const chip = e.target.closest('.chance-chip');
            if (!chip) return;
            chips.forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            selectedChance = Number(chip.dataset.chance);
            hubChance.textContent = selectedChance + '%';
            drawWheel();
        });

        // ──────── BET ────────
        const betInput = document.getElementById('betInput');
        betInput.addEventListener('input', function() {
            let v = this.value.replace(/[^0-9.]/g, '');
            if ((v.match(/\./g) || []).length > 1) v = v.slice(0, v.lastIndexOf('.'));
            const p = v.split('.');
            if (p[1]?.length > 2) v = p[0] + '.' + p[1].slice(0, 2);
            this.value = v;
        });

        function quickBet(f) {
            if (balance <= 0) return;
            betInput.value = (balance * f).toFixed(2);
            betInput.focus();
        }

        function openProfile() {
            tg.sendData(JSON.stringify({ action: 'profile' }));
        }

        // ──────── TOAST ────────
        function showToast(msg, type) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            const icon = document.createElement('span');
            icon.className = 'toast-icon';
            icon.innerHTML = type === 'win'
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20,6 9,17 4,12"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
            const txt = document.createElement('span');
            txt.textContent = msg;
            t.appendChild(icon);
            t.appendChild(txt);
            c.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ──────── GLOW ────────
        function setResultUI(type) {
            const aura = document.getElementById('wheelAura');
            const ptr = document.getElementById('wheelPointer');
            aura.className = 'wheel-aura ' + type;
            ptr.className = 'wheel-pointer ' + type;
            setTimeout(() => {
                aura.className = 'wheel-aura';
                ptr.className = 'wheel-pointer';
            }, 1000);
        }

        // ──────── SPIN ────────
        function spinWheel(won, cb) {
            isSpinning = true;
            const speed = 10 + Math.random() * 22;
            const duration = 2000 + Math.random() * 1400;
            const startRot = rotation;
            const t0 = performance.now();
            let hlDone = false;
            let inten = 0;

            (function anim(now) {
                const p = Math.min((now - t0) / duration, 1);
                const ease = 1 - Math.pow(1 - p, 4);
                const bounce = p > 0.82
                    ? Math.sin((p - 0.82) / 0.18 * Math.PI * 2) * 0.018 * (1 - p)
                    : 0;
                rotation = startRot + (speed * duration / 1000) * (ease + bounce);

                if (p > 0.78 && !hlDone) hlDone = true;
                inten = hlDone ? Math.min(1, (p - 0.78) / 0.22) : 0;
                drawWheel(hlDone ? (won ? 'win' : 'lose') : null, inten);

                if (p < 1) {
                    requestAnimationFrame(anim);
                } else {
                    drawWheel(won ? 'win' : 'lose', 1);
                    setResultUI(won ? 'win' : 'lose');
                    isSpinning = false;
                    cb();
                }
            })(t0);
        }

        // ──────── PLAY ────────
        function play() {
            if (isSpinning) return;
            const bet = parseFloat(betInput.value.trim());
            if (!bet || bet <= 0 || isNaN(bet)) {
                showToast('Введите сумму ставки', 'lose');
                return shake(betInput);
            }
            if (bet > balance) {
                showToast('Недостаточно средств', 'lose');
                return shake(document.getElementById('balancePill'));
            }

            const btn = document.getElementById('playBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            const won = Math.random() * 100 <= selectedChance;
            const mult = multipliers[selectedChance];

            spinWheel(won, () => {
                const delta = won ? bet * mult : -bet;
                balance += delta;
                updateBalance();
                pulseBalance(delta);
                const amt = won ? (bet * mult).toFixed(2) : bet.toFixed(2);
                showToast((won ? '+' : '−') + amt + ' ₽', won ? 'win' : 'lose');
                btn.classList.remove('loading');
                btn.disabled = false;
                betInput.value = '';
                betInput.blur();
                tg.sendData(JSON.stringify({
                    action: 'play',
                    bet, chance: selectedChance, won, multiplier: mult
                }));
            });
        }

        function shake(el) {
            el.style.animation = 'none'; el.offsetHeight;
            el.style.animation = 'shake 0.4s ease';
            setTimeout(() => el.style.animation = '', 400);
        }

        (function() {
            const s = document.createElement('style');
            s.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}';
            document.head.appendChild(s);
        })();

        function pulseBalance(d) {
            const p = document.getElementById('balancePill');
            p.style.transform = d > 0 ? 'scale(1.07)' : 'scale(0.94)';
            p.style.borderColor = d > 0 ? 'var(--green)' : 'var(--red)';
            setTimeout(() => { p.style.transform = ''; p.style.borderColor = ''; }, 350);
        }

        function updateBalance() {
            document.getElementById('balanceMini').textContent = balance.toFixed(2);
        }

        window.updateBalance = v => { balance = v; updateBalance(); };
        window.setBalance = v => { balance = v; updateBalance(); };
        updateBalance();

        // Idle slow drift
        (function idle() {
            if (!isSpinning) { rotation += 0.00025; drawWheel(); }
            requestAnimationFrame(idle);
        })();
    </script>
</body>
</html>
