<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPMONEY Cyber Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #06070d;
            --panel-color: rgba(20, 24, 38, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ffcc00;
            --accent-gradient: linear-gradient(135deg, #ffe600 0%, #ffaa00 100%);
            --accent-glow: rgba(255, 204, 0, 0.4);
            --text-color: #ffffff;
            --text-muted: #7e8494;
            --green-color: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.3);
            --red-color: #ff3355;
            --red-glow: rgba(255, 51, 85, 0.3);
        }

        /* Полная блокировка скролла и системных свайпов */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        html, body { background-color: var(--bg-color); color: var(--text-color); width: 100%; height: 100vh; overflow: hidden; position: relative; }

        /* Живой анимированный фон */
        body::before {
            content: ''; position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,204,0,0.08) 0%, transparent 70%);
            top: -50px; left: -50px; z-index: 0; animation: floatBg 8s infinite alternate ease-in-out;
        }
        body::after {
            content: ''; position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,255,136,0.05) 0%, transparent 70%);
            bottom: -50px; right: -50px; z-index: 0; animation: floatBg 12s infinite alternate-reverse ease-in-out;
        }
        @keyframes floatBg { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, 40px); } }

        /* Фиксированный контейнер под высоту экрана */
        .app-container { 
            width: 100%; max-width: 440px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; position: relative; z-index: 1; overflow: hidden;
        }

        /* ЭКРАН ВХОДА (ВЫСШИЙ ГЛАССМОРФИЗМ) */
        .auth-screen { 
            position: absolute; inset: 0; background: rgba(6, 7, 13, 0.85); 
            backdrop-filter: blur(25px) saturate(160%); -webkit-backdrop-filter: blur(25px) saturate(160%);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 24px; transition: all 0.5s ease;
        }
        .auth-card {
            background: var(--panel-color); border: 1px solid var(--panel-border);
            padding: 32px 24px; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 18px; backdrop-filter: blur(10px);
        }
        .auth-logo { text-align: center; font-size: 38px; font-weight: 900; letter-spacing: 2px; }
        .auth-logo span { color: var(--accent-color); text-shadow: 0 0 20px var(--accent-glow); }
        
        .auth-input { 
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--panel-border); padding: 16px; 
            border-radius: 16px; color: white; font-size: 16px; outline: none; width: 100%;
            transition: all 0.3s ease; text-align: center;
        }
        .auth-input:focus { border-color: var(--accent-color); background: rgba(255,255,255,0.07); box-shadow: 0 0 15px rgba(255, 204, 0, 0.15); }
        .auth-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
        
        .auth-btn { padding: 16px; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer; border: none; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-login { background: rgba(255,255,255,0.06); color: white; border: 1px solid var(--panel-border); }
        .btn-login:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .btn-register { background: var(--accent-gradient); color: black; box-shadow: 0 6px 20px var(--accent-glow); }
        .btn-register:active { transform: scale(0.95); filter: brightness(1.1); }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        header { 
            padding: 16px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--panel-border); background: rgba(6, 7, 13, 0.5); backdrop-filter: blur(10px);
        }
        .logo-text { font-weight: 900; font-size: 22px; letter-spacing: 0.5px; }
        .logo-text span { color: var(--accent-color); }

        .balance-badge { 
            background: rgba(255, 204, 0, 0.06); border: 1px solid rgba(255, 204, 0, 0.25); padding: 8px 16px; 
            border-radius: 100px; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px;
            box-shadow: 0 0 15px rgba(255,204,0,0.03); transition: all 0.3s;
        }
        .balance-badge.bump { transform: scale(1.1); border-color: var(--green-color); color: var(--green-color); }

        .profile-trigger { 
            width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.05); 
            border: 2px solid var(--accent-color); overflow: hidden; cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-trigger:active { transform: scale(0.88); }
        .profile-trigger img { width: 100%; height: 100%; object-fit: cover; }

        /* ГЛАВНЫЙ КОНТЕНТ (БЕЗ СКРОЛЛА) */
        .content { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; overflow: hidden; justify-content: space-between; }

        /* НАВИГАЦИЯ ТАБЫ */
        .tabs-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 16px; border: 1px solid var(--panel-border); }
        .tab-btn { 
            background: transparent; border: none; color: var(--text-muted); 
            padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active { color: #000; background: var(--accent-gradient); box-shadow: 0 4px 15px var(--accent-glow); }

        /* НЕОНОВОЕ КОЛЕСО */
        .wheel-container { 
            position: relative; width: 230px; height: 230px; margin: 5px auto; 
            display: flex; justify-content: center; align-items: center; 
            border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }
        .svg-ring { transform: rotate(-90deg); filter: drop-shadow(0 0 10px rgba(0,0,0,0.7)); }
        .ring-bg { fill: none; stroke: rgba(20,24,38,0.8); stroke-width: 18; }
        .ring-fill { 
            fill: none; stroke: url(#accent-grad); stroke-width: 18; 
            stroke-linecap: round; stroke-dasharray: 565.48; stroke-dashoffset: 282.74; 
            transition: stroke-dashoffset 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            animation: pulseGlow 2s infinite alternate ease-in-out;
        }
        @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 4px var(--accent-glow)); } 100% { filter: drop-shadow(0 0 12px var(--accent-glow)); } }
        
        .wheel-center-text { position: absolute; text-align: center; z-index: 2; pointer-events: none; animation: floatText 4s infinite ease-in-out; }
        @keyframes floatText { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .chance-display { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums; }
        .chance-lbl { font-size: 11px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; }

        .axial-pointer-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 3; pointer-events: none; display: flex; justify-content: center; align-items: center; }
        .axial-needle { 
            position: absolute; width: 4px; height: 105px; 
            background: linear-gradient(to top, transparent 20%, #ffffff 60%, var(--accent-color) 100%); 
            bottom: 50%; transform-origin: bottom center; border-radius: 4px; 
            box-shadow: 0 0 15px var(--accent-color); transform: rotate(0deg); 
        }
        .axial-center-dot { 
            width: 18px; height: 18px; background: #fff; border-radius: 50%; z-index: 4; 
            box-shadow: 0 0 20px var(--accent-color), inset 0 0 4px rgba(0,0,0,0.6);
            border: 3px solid #0b0c10;
        }

        /* КАРТОЧКИ ВВОДА */
        .game-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .slot-card { 
            background: var(--panel-color); border: 1px solid var(--panel-border); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 4px;
            transition: all 0.25s ease;
        }
        .slot-card:focus-within { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.03); }
        .slot-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        .slot-input { background: transparent; border: none; color: #fff; font-size: 22px; font-weight: 900; width: 100%; outline: none; }

        /* БЫСТРЫЙ ВЫБОР ШАНСА */
        .inline-chances { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .chance-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); color: #fff; 
            padding: 12px 0; border-radius: 14px; font-size: 13px; font-weight: 800; cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .chance-btn:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
        .chance-btn:active { transform: scale(0.93); background: var(--accent-gradient); color: #000; box-shadow: 0 0 10px var(--accent-glow); }

        /* ПОЛЗУНОК */
        .quick-slider-section { background: var(--panel-color); border: 1px solid var(--panel-border); padding: 14px 16px; border-radius: 20px; backdrop-filter: blur(10px); }
        .custom-range { width: 100%; -webkit-appearance: none; background: rgba(255,255,255,0.06); height: 8px; border-radius: 10px; outline: none; }
        .custom-range::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; 
            background: #fff; border: 5px solid var(--accent-color); cursor: pointer; 
            box-shadow: 0 0 12px var(--accent-glow); transition: transform 0.1s;
        }
        .custom-range::-webkit-slider-thumb:active { transform: scale(1.2); }

        /* КНОПКА КЛИКА */
        .upgrade-btn { 
            background: var(--accent-gradient); color: #000; border: none; border-radius: 20px; padding: 18px; font-size: 18px; 
            font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.3); transition: all 0.25s ease;
            position: relative; overflow: hidden;
        }
        .upgrade-btn::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 30%; height: 200%; background: rgba(255,255,255,0.3);
            transform: rotate(30deg); transition: none; animation: flashBtn 4s infinite linear;
        }
        @keyframes flashBtn { 0% { left: -60%; } 15% { left: 130%; } 100% { left: 130%; } }
        .upgrade-btn:active { transform: scale(0.97); filter: brightness(0.9); }
        .upgrade-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ОКНО КОШЕЛЬКА */
        .wallet-section { 
            background: var(--panel-color); border: 1px solid var(--panel-border); 
            border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; 
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .wallet-instruction { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
        
        .credit-card-box {
            background: linear-gradient(135deg, rgba(30,35,55,0.9) 0%, rgba(15,18,30,0.9) 100%);
            border: 1px solid rgba(255,204,0,0.2); border-radius: 16px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: all 0.2s;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.4);
        }
        .credit-card-box:active { transform: scale(0.98); border-color: var(--accent-color); }
        .card-chip { width: 30px; height: 22px; background: rgba(255,255,255,0.15); border-radius: 4px; }
        .card-number { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-family: monospace; text-align: center; margin: 4px 0; }
        .card-copy-hint { font-size: 10px; color: var(--accent-color); text-align: center; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }

        .wallet-input { 
            background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border); padding: 14px 16px; 
            border-radius: 14px; color: white; font-size: 16px; outline: none; transition: all 0.2s; text-align: center;
        }
        .wallet-input:focus { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); }
        .wallet-btn { 
            background: var(--green-color); color: black; border: none; padding: 15px; 
            border-radius: 14px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 6px 20px var(--green-glow); transition: all 0.2s;
        }

        /* ПРОФИЛЬ С ИСТОРИЕЙ ИГР */
        .profile-view { 
            position: absolute; top: 75px; left: 0; width: 100%; height: calc(100% - 75px); 
            background: var(--bg-color); z-index: 50; padding: 16px; display: flex; flex-direction: column; 
            gap: 14px; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            overflow: hidden; justify-content: space-between;
        }
        .profile-view.active { transform: translateX(0); }
        
        .profile-card { 
            background: var(--panel-color); border: 1px solid var(--panel-border); backdrop-filter: blur(10px);
            border-radius: 24px; padding: 16px; display: flex; align-items: center; gap: 16px; 
        }
        .profile-avatar-big { 
            width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--accent-color); 
            overflow: hidden; box-shadow: 0 0 15px var(--accent-glow); cursor: pointer;
        }
        .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: rgba(255,255,255,0.02); border: 1px solid var(--panel-border); padding: 12px; border-radius: 16px; text-align: center; }
        .stat-val { font-size: 20px; font-weight: 900; margin-top: 4px; }

        /* БЛОК ИСТОРИИ ИГР */
        .history-section { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; margin: 4px 0; }
        .history-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1.5px; padding-left: 4px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; overflow: hidden; } 
        
        .history-item { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border);
            padding: 12px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(5px); animation: slideIn 0.3s cubic-bezier(0.14, 1, 0.34, 1);
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .hist-badge { padding: 4px 10px; border-radius: 10px; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .hist-win { background: rgba(0, 255, 136, 0.1); color: var(--green-color); border: 1px solid rgba(0, 255, 136, 0.2); box-shadow: 0 0 10px rgba(0,255,136,0.05); }
        .hist-loss { background: rgba(255, 51, 85, 0.1); color: var(--red-color); border: 1px solid rgba(255, 51, 85, 0.2); box-shadow: 0 0 10px rgba(255,51,85,0.05); }
        
        .hist-info { text-align: right; }
        .hist-amount { font-weight: 800; font-size: 15px; color: #fff; }
        .hist-time { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        /* КНОПКА ВЫХОДА */
        .logout-btn { background: transparent; border: 1px solid rgba(255, 51, 85, 0.3); color: var(--red-color); font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s; margin-top: 4px; display: inline-block; }
        .logout-btn:active { background: rgba(255, 51, 85, 0.1); transform: scale(0.95); }

        /* УВЕДОМЛЕНИЯ ТОСТЫ */
        .toast { 
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%) scale(0.8); 
            padding: 14px 24px; border-radius: 18px; font-size: 14px; font-weight: 800; 
            z-index: 200; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; text-align: center; width: 85%; box-shadow: 0 15px 35px rgba(0,0,0,0.4); backdrop-filter: blur(10px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
        .toast-success { background: rgba(12, 36, 23, 0.9); border: 1px solid var(--green-color); color: var(--green-color); box-shadow: 0 0 20px var(--green-glow); }
        .toast-error { background: rgba(43, 18, 21, 0.9); border: 1px solid var(--red-color); color: var(--red-color); box-shadow: 0 0 20px var(--red-glow); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="toast-msg" class="toast"></div>

        <div class="auth-screen" id="auth-screen">
            <div class="auth-card">
                <div class="auth-logo">▲ <span>UPMONEY</span></div>
                <input type="text" class="auth-input" id="auth-user" placeholder="Придумайте логин">
                <input type="password" class="auth-input" id="auth-pass" placeholder="Пароль аккаунта">
                <div class="auth-buttons">
                    <button class="auth-btn btn-login" id="btn-login">Войти</button>
                    <button class="auth-btn btn-register" id="btn-register">Создать</button>
                </div>
            </div>
        </div>

        <header>
            <div class="logo-text">▲ <span>UPMONEY</span></div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="balance-badge" id="balance-badge-container"><span id="header-balance">0.00</span><span>₽</span></div>
                <div class="profile-trigger" id="go-profile">
                    <img id="my-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237e8494'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>">
                </div>
            </div>
        </header>

        <div class="profile-view" id="profile-page">
            <div class="profile-card">
                <div class="profile-avatar-big" onclick="document.getElementById('file-avatar').click()">
                    <img id="big-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237e8494'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>">
                </div>
                <input type="file" id="file-avatar" accept="image/*" style="display:none;">
                <div>
                    <h3 id="user-title" style="letter-spacing: 0.5px; font-weight: 900;">ИГРОК</h3>
                    <button class="logout-btn" id="btn-logout">Сменить аккаунт</button>
                </div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box"><div style="font-size:11px;color:var(--text-muted);font-weight:800;">Всего игр</div><div class="stat-val" id="st-games" style="color:var(--accent-color)">0</div></div>
                <div class="stat-box"><div style="font-size:11px;color:var(--text-muted);font-weight:800;">Винрейт</div><div class="stat-val" id="st-wr" style="color:#fff">0%</div></div>
            </div>

            <div class="history-section">
                <div class="history-title">Последние Апгрейды</div>
                <div class="history-list" id="history-container"></div>
            </div>

            <button class="tab-btn" id="back-to-game" style="background: rgba(255,255,255,0.04); color: #fff; border: 1px solid var(--panel-border); border-radius: 16px; padding: 14px; width: 100%;">Вернуться в лобби</button>
        </div>

        <div class="content">
            <div class="tabs-menu">
                <button class="tab-btn active" id="tab-game">Апгрейды</button>
                <button class="tab-btn" id="tab-wallet">Кошелек</button>
            </div>

            <div id="view-game" style="display:flex; flex-direction:column; gap:14px; flex: 1; justify-content: center;">
                <div class="wheel-container">
                    <svg class="svg-ring" width="220" height="220">
                        <defs>
                            <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffe600" />
                                <stop offset="100%" stop-color="#ffaa00" />
                            </linearGradient>
                        </defs>
                        <circle class="ring-bg" cx="110" cy="110" r="92"></circle>
                        <circle class="ring-fill" id="ring-progress" cx="110" cy="110" r="92"></circle>
                    </svg>
                    <div class="wheel-center-text">
                        <div class="chance-display" id="chance-percent">50.00%</div>
                        <div class="chance-lbl">шанс</div>
                    </div>
                    <div class="axial-pointer-container">
                        <div class="axial-needle" id="axial-needle"></div>
                        <div class="axial-center-dot"></div>
                    </div>
                </div>

                <div class="game-slots">
                    <div class="slot-card">
                        <div class="slot-title">Ставка</div>
                        <input type="number" class="slot-input" id="input-bet" value="10" min="1">
                    </div>
                    <div class="slot-card">
                        <div class="slot-title">Выигрыш</div>
                        <input type="number" class="slot-input" id="input-target" value="20">
                    </div>
                </div>

                <div class="quick-slider-section">
                    <input type="range" class="custom-range" id="chance-slider" min="1" max="75" value="50">
                </div>

                <div class="inline-chances">
                    <button class="chance-btn" data-val="10">10%</button>
                    <button class="chance-btn" data-val="25">25%</button>
                    <button class="chance-btn" data-val="50">50%</button>
                    <button class="chance-btn" data-val="75">75%</button>
                    <button class="chance-btn" data-val="75">MAX</button>
                </div>

                <button class="upgrade-btn" id="upgrade-button">Запустить апгрейд</button>
            </div>

            <div id="view-wallet" class="hidden" style="display:flex; flex-direction:column; gap:14px; flex: 1; justify-content: center;">
                <div class="wallet-section">
                    <h4 style="color:var(--accent-color); font-size: 15px; font-weight: 900;">📥 Пополнение счета</h4>
                    <p class="wallet-instruction">Переведите рубли на карту. Нажмите на неё, чтобы скопировать номер автоматически:</p>
                    
                    <div class="credit-card-box" id="credit-card" title="Нажмите, чтобы скопировать">
                        <div class="card-chip"></div>
                        <div class="card-number" id="card-num-text">2200 1545 8773 9565</div>
                        <div class="card-copy-hint">Нажми для копирования</div>
                    </div>

                    <input type="number" class="wallet-input" id="dep-amount" placeholder="Сумма перевода (₽)">
                    <button class="wallet-btn" id="btn-deposit">Создать уведомление</button>
                </div>

                <div class="wallet-section">
                    <h4 style="color:var(--red-color); font-size: 15px; font-weight: 900;">📤 Вывод средств</h4>
                    <input type="number" class="wallet-input" id="with-amount" placeholder="Сумма к выводу (₽)">
                    <button class="wallet-btn" style="background:var(--red-color); box-shadow: 0 6px 20px var(--red-glow);" id="btn-withdraw">Подать заявку</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = "https://darling-clever-splatter.ngrok-free.dev"; 
        
        const tgUserRaw = tg.initDataUnsafe?.user || { id: 6568063076 };
        const myTelegramId = tgUserRaw.id;

        let userLocal = null; 
        let isPlaying = false;
        let localHistory = []; 
        const ringCircumference = 2 * Math.PI * 92;

        const ringProgress = document.getElementById('ring-progress');
        const chancePercent = document.getElementById('chance-percent');
        const chanceSlider = document.getElementById('chance-slider');
        const inputBet = document.getElementById('input-bet');
        const inputTarget = document.getElementById('input-target');
        const axialNeedle = document.getElementById('axial-needle');
        const upgradeButton = document.getElementById('upgrade-button');
        const historyContainer = document.getElementById('history-container');

        ringProgress.style.strokeDasharray = ringCircumference;

        document.addEventListener('touchmove', function (e) { if(e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

        function showToast(text, isSuccess) {
            const t = document.getElementById('toast-msg');
            t.textContent = text;
            t.className = `toast ${isSuccess ? 'toast-success' : 'toast-error'} show`;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        document.getElementById('credit-card').addEventListener('click', () => {
            const rawCardNum = "2200154587739565";
            navigator.clipboard.writeText(rawCardNum).then(() => {
                showToast("Номер карты скопирован!", true);
            }).catch(() => {
                showToast("Не удалось скопировать", false);
            });
        });

        // Функция автоматического скрытия экрана входа
        function hideAuthScreen() {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('auth-screen').classList.add('hidden'), 500);
        }

        // --- АВТОМАТИЧЕСКИЙ ВХОД (ПРИ ЗАПУСКЕ) ---
        async function checkAutoLogin() {
            const savedUser = localStorage.getItem('upmoney_user');
            const savedPass = localStorage.getItem('upmoney_pass');

            if (savedUser && savedPass) {
                try {
                    // Проверяем актуальные данные аккаунта на сервере
                    let res = await fetch(`${API_URL}/api/auth`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'login', username: savedUser, password: savedPass, tg_id: myTelegramId })
                    });
                    let data = await res.json();
                    if (res.ok) {
                        userLocal = data.user;
                        hideAuthScreen();
                        showToast(`Успешный авто-вход: ${userLocal.username}`, true);
                        syncUI();
                    } else {
                        localStorage.clear(); // Стираем битые данные, если пароль поменялся
                    }
                } catch(e) {
                    // Если локальная отладка и нет сети — заходим по памяти автономно
                    hideAuthScreen();
                    userLocal = { username: savedUser, balance: 500.0, games:0, wins:0, losses:0, avatar:null };
                    syncUI();
                }
            }
        }

        async function sendAuth(action) {
            const usernameInput = document.getElementById('auth-user').value.trim();
            const passwordInput = document.getElementById('auth-pass').value.trim();
            if(!usernameInput || !passwordInput) { showToast("Введите все данные!", false); return; }

            try {
                let res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action, username: usernameInput, password: passwordInput, tg_id: myTelegramId })
                });
                let data = await res.json();
                if(res.ok) {
                    userLocal = data.user;
                    
                    // СОХРАНЯЕМ ДАННЫЕ В БРАУЗЕР НАВСЕГДА
                    localStorage.setItem('upmoney_user', usernameInput);
                    localStorage.setItem('upmoney_pass', passwordInput);

                    hideAuthScreen();
                    showToast(action === 'register' ? "Аккаунт создан! Бонус +50₽" : "С возвращением!", true);
                    syncUI();
                } else { showToast(data.error || "Ошибка", false); }
            } catch(e) {
                showToast("Вход в режиме локальной отладки", true);
                userLocal = { username: usernameInput, balance: 500.0, games:0, wins:0, losses:0, avatar:null };
                localStorage.setItem('upmoney_user', usernameInput);
                localStorage.setItem('upmoney_pass', passwordInput);
                hideAuthScreen();
                syncUI();
            }
        }

        document.getElementById('btn-login').addEventListener('click', () => sendAuth('login'));
        document.getElementById('btn-register').addEventListener('click', () => sendAuth('register'));

        // Кнопка смены аккаунта в профиле
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.clear();
            location.reload(); // Перезагружаем приложение, откроется окно логина
        });

        function updateHistoryDOM() {
            historyContainer.innerHTML = "";
            const displayHistory = localHistory.slice(-4).reverse();
            
            if(displayHistory.length === 0) {
                historyContainer.innerHTML = `<div style="text-align:center; font-size:12px; color:var(--text-muted); padding:10px;">История пуста. Сделайте первую ставку!</div>`;
                return;
            }

            displayHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `
                    <div class="hist-badge ${item.win ? 'hist-win' : 'hist-loss'}">${item.win ? 'Вин' : 'Луз'}</div>
                    <div class="hist-info">
                        <div class="hist-amount">${item.win ? '+' : '-'}${item.amount.toFixed(2)}₽</div>
                        <div class="hist-time">${item.time} (x${item.mult})</div>
                    </div>
                `;
                historyContainer.appendChild(div);
            });
        }

        function syncUI() {
            if(!userLocal) return;
            document.getElementById('header-balance').textContent = userLocal.balance.toFixed(2);
            document.getElementById('user-title').textContent = userLocal.username.toUpperCase();
            document.getElementById('st-games').textContent = userLocal.games;
            const wr = userLocal.games > 0 ? Math.round((userLocal.wins / userLocal.games) * 100) : 0;
            document.getElementById('st-wr').textContent = wr + '%';

            if(userLocal.avatar) {
                document.getElementById('my-avatar').src = userLocal.avatar;
                document.getElementById('big-avatar').src = userLocal.avatar;
            }
            updateHistoryDOM();
        }

        async function saveGameStats() {
            syncUI();
            try {
                await fetch(`${API_URL}/api/game/save`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(userLocal)
                });
            } catch(e){}
        }

        function updateRing(chance) {
            if(chance > 75) chance = 75;
            const offset = ringCircumference - (chance / 100) * ringCircumference;
            ringProgress.style.strokeDashoffset = offset;
            chancePercent.textContent = chance.toFixed(2) + '%';
        }

        function recalculateByChance() {
            let bet = parseFloat(inputBet.value) || 0;
            let chance = parseFloat(chanceSlider.value);
            if(chance > 75) { chance = 75; chanceSlider.value = 75; }
            updateRing(chance);
            if (bet > 0) inputTarget.value = (bet * (100 / chance)).toFixed(2);
        }

        function recalculateByTarget() {
            let bet = parseFloat(inputBet.value) || 0;
            let target = parseFloat(inputTarget.value) || 0;
            if (bet > 0 && target > bet) {
                let chance = (bet / target) * 100;
                chance = Math.max(1, Math.min(75, chance));
                chanceSlider.value = Math.round(chance);
                updateRing(chance);
            }
        }

        document.querySelectorAll('.chance-btn').forEach(b => {
            b.addEventListener('click', (e) => {
                if(isPlaying) return;
                chanceSlider.value = e.target.getAttribute('data-val');
                recalculateByChance();
            });
        });

        chanceSlider.addEventListener('input', recalculateByChance);
        inputBet.addEventListener('input', recalculateByChance);
        inputTarget.addEventListener('input', recalculateByTarget);

        upgradeButton.addEventListener('click', () => {
            if (isPlaying || !userLocal) return;
            let bet = parseFloat(inputBet.value) || 0;
            if (bet <= 0 || bet > userLocal.balance) { showToast("Проверьте сумму ставки!", false); return; }

            isPlaying = true;
            upgradeButton.disabled = true;
            userLocal.balance -= bet;
            document.getElementById('header-balance').textContent = userLocal.balance.toFixed(2);
            document.getElementById('balance-badge-container').classList.add('bump');

            const chance = parseFloat(chanceSlider.value);
            const roll = Math.random() * 100; 
            const isWin = roll <= chance;    

            let targetAngle = 0;
            if (isWin) {
                targetAngle = Math.random() * (chance * 3.6);
            } else {
                targetAngle = (chance * 3.6) + Math.random() * ((100 - chance) * 3.6);
            }

            const totalRotation = 2160 + targetAngle; 
            const duration = 2800; 

            axialNeedle.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.9, 0.2, 1)`;
            axialNeedle.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                axialNeedle.style.transition = 'none';
                axialNeedle.style.transform = `rotate(${targetAngle}deg)`;
                document.getElementById('balance-badge-container').classList.remove('bump');
                
                userLocal.games++;
                let mult = (100 / chance).toFixed(1);
                let now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

                if (isWin) {
                    let winAmount = parseFloat(inputTarget.value);
                    userLocal.balance += winAmount;
                    userLocal.wins++;
                    showToast(`Апгрейд прошёл! +${winAmount.toFixed(2)}₽`, true);
                    localHistory.push({ win: true, amount: winAmount, mult: mult, time: now });
                } else {
                    userLocal.losses++;
                    showToast("Увы, предмет сгорел", false);
                    localHistory.push({ win: false, amount: bet, mult: mult, time: now });
                }

                isPlaying = false;
                upgradeButton.disabled = false;
                saveGameStats();
            }, duration);
        });

        async function sendTransaction(type, amount) {
            if(!userLocal) return;
            try {
                let res = await fetch(`${API_URL}/api/transaction`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: userLocal.username, tg_id: myTelegramId, type: type, amount: amount })
                });
                if(res.ok) {
                    showToast("Уведомление отправлено админу!", true);
                    document.getElementById('dep-amount').value = '';
                    document.getElementById('with-amount').value = '';
                } else {
                    let err = await res.json();
                    showToast(err.error || "Ошибка создания", false);
                }
            } catch(e) { showToast("Сервер не отвечает.", false); }
        }

        document.getElementById('btn-deposit').addEventListener('click', () => {
            let val = parseFloat(document.getElementById('dep-amount').value);
            if(val > 0) sendTransaction('deposit', val);
        });

        document.getElementById('btn-withdraw').addEventListener('click', () => {
            let val = parseFloat(document.getElementById('with-amount').value);
            if(val > 0) sendTransaction('withdraw', val);
        });

        document.getElementById('file-avatar').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !userLocal) return;
            const r = new FileReader();
            r.onloadend = async function() {
                userLocal.avatar = r.result;
                syncUI();
                try {
                    await fetch(`${API_URL}/api/avatar/save`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: userLocal.username, avatar: r.result})
                    });
                } catch(err){}
            };
            r.readAsDataURL(file);
        });

        document.getElementById('go-profile').addEventListener('click', () => document.getElementById('profile-page').classList.add('active'));
        document.getElementById('back-to-game').addEventListener('click', () => document.getElementById('profile-page').classList.remove('active'));
        
        document.getElementById('tab-game').addEventListener('click', (e) => {
            document.getElementById('view-game').classList.remove('hidden');
            document.getElementById('view-wallet').classList.add('hidden');
            document.getElementById('tab-wallet').classList.remove('active');
            e.target.classList.add('active');
        });
        document.getElementById('tab-wallet').addEventListener('click', (e) => {
            document.getElementById('view-wallet').classList.remove('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('tab-game').classList.remove('active');
            e.target.classList.add('active');
        });

        // Запуск триггера проверки сохраненной сессии
        recalculateByChance();
        checkAutoLogin();
    </script>
</body>
</html>
